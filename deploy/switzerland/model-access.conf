# Dedicated no-shell account for the production model tunnel.
Match User swiss-model
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding local
    AllowStreamLocalForwarding no
    PermitOpen 127.0.0.1:30081 127.0.0.1:30082 127.0.0.1:8017
    PermitListen none
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    ForceCommand /bin/false
Match all
